name: Deploy production (prebuilt)

# Build on a GitHub runner, deploy the output to Vercel, tag the release.
#
# Why this exists: Vercel's Hobby builder runs Next's static generation in a
# single worker, and that worker runs out of heap at roughly 145 pages. A
# GitHub runner has more cores, so static generation gets more workers and the
# per-worker ceiling stops binding — which is what lets `prerendered_rackets`
# go well above the 30 the Hobby builder can survive.
#
# Deliberately manual. Vercel's own git integration still builds every push to
# main at the default 30 rackets, and that path has to keep working on its own;
# this is the deliberate, larger release, not a replacement for it.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA on main to build (full or short)"
        required: true
        type: string
      prerendered_rackets:
        description: "Racket detail pages to prerender, per locale. Hobby's own builder caps out near 30; a runner handles far more."
        required: false
        default: "35"
        type: string
      tag:
        description: "Release tag. Blank generates v<YYYY.MM.DD>-<short-sha>."
        required: false
        type: string
      dry_run:
        description: "Build only — do not deploy, do not tag."
        required: false
        default: false
        type: boolean

# One production deploy at a time. Not cancel-in-progress: interrupting a
# half-finished deploy is worse than making the next one wait.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  # Pinned. `vercel@latest` changing under a release is not a surprise worth having.
  VERCEL_CLI_VERSION: "59.11.2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Only what creating the tag and release needs.
      contents: write

    steps:
      - name: Check required configuration
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            value="${!name}"
            if [ -z "$value" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          # Fail here rather than three steps later inside a Vercel CLI error.
          [ "$missing" -eq 0 ] || exit 1

      - name: Checkout the requested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          # Full history: the ancestry check below and the tag both need it.
          fetch-depth: 0

      - name: Verify the commit is on main
        run: |
          git fetch origin main --quiet
          sha="$(git rev-parse HEAD)"
          # The input is meant to name a commit that is already on main. Deploying
          # something that is not would put unreviewed code into production under a
          # release tag, which is the one thing this workflow must not do quietly.
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not an ancestor of origin/main. Merge it first."
            exit 1
          fi
          {
            echo "SHA=$sha"
            echo "SHORT_SHA=$(git rev-parse --short=8 HEAD)"
          } >> "$GITHUB_ENV"
          echo "Deploying $sha"
          git log -1 --pretty='  %s%n  by %an on %ad' --date=short

      - uses: actions/setup-node@v6
        with:
          # Matches the runtime Vercel uses, so a build-time failure here is a
          # real failure and not a version difference.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fit the prerender count to this runner
        run: |
          cores="$(nproc)"
          asked="${{ inputs.prerendered_rackets }}"

          # Next.js creates static workers with `isolatedMemory: true`, which
          # deletes --max-old-space-size from worker processes' NODE_OPTIONS.
          # By default Next calculates workers as `os.cpus().length - 1` (1 worker on 2-core runners),
          # causing a single worker to attempt processing all pages and run out of V8 heap near ~70 pages.
          #
          # We set NEXT_BUILD_CPUS=4 (read by `next.config.ts`) to force Next.js to use 4 static workers.
          # The build currently has ~149 pages before racket detail params: 72
          # string detail pages plus static pages and dynamic-route shells. The
          # old estimate reserved only 75, so 72 rackets produced 293 pages —
          # ~73 per worker — and page generation repeatedly timed out.
          workers=4
          pages_per_worker_limit=55
          non_racket_pages=150
          budget=$(( (pages_per_worker_limit * workers - non_racket_pages) / 2 ))
          rackets="$asked"
          if [ "$rackets" -gt "$budget" ]; then
            rackets="$budget"
            echo "::warning::${asked} rackets needs more than this runner's ${workers} workers can build. Using ${rackets}, the most that fits safely. Nothing is lost from the catalogue — unlisted paths still serve an App Shell and upgrade in the background."
          fi

          pages=$(( rackets * 2 + non_racket_pages ))
          echo "cores             : $cores"
          echo "static workers    : $workers (via NEXT_BUILD_CPUS)"
          echo "requested rackets : $asked"
          echo "building rackets  : $rackets"
          echo "prerendered pages : ~$pages"
          echo "pages per worker  : ~$(( pages / workers ))   (heap ceiling near ~65-70 per worker)"
          echo "PRERENDERED_RACKETS=$rackets" >> "$GITHUB_ENV"
          echo "NEXT_BUILD_CPUS=$workers" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Install the Vercel CLI
        # Pinned via VERCEL_CLI_VERSION above, so a CLI release cannot change what
        # this workflow does between two runs of the same commit.
        run: npm install -g --allow-scripts=esbuild "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull production environment from Vercel
        # Brings down the project settings and the production env vars, so the
        # build here matches the one Vercel would have run itself.
        run: vercel pull --yes --environment=production

      - name: Build with production settings
        env:
          # NODE_OPTIONS increases heap size for parent Node process (Turbopack & TypeScript).
          # NEXT_BUILD_CPUS forces Next static generation to use multiple workers.
          NODE_OPTIONS: "--max-old-space-size=8192"
          NEXT_BUILD_CPUS: ${{ env.NEXT_BUILD_CPUS }}
          PRERENDERED_RACKETS: ${{ env.PRERENDERED_RACKETS }}
        run: vercel build --prod

      - name: Count the build output
        id: output_size
        run: |
          files="$(find .vercel/output -type f | wc -l)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo ".vercel/output holds $files files"
          # Uploaded as an archive below, so this is a number to watch rather
          # than a budget to stay under. Printed because the day it stops being
          # an archive, this is the number that decides whether the deploy is
          # possible at all.
          if [ "$files" -gt 5000 ]; then
            echo "::warning title=Large build output::$files files. Fine while --archive=tgz is in use; a file-by-file upload would exceed Hobby's 5000-uploads-per-day limit in a single deploy."
          fi

      - name: Deploy the build output
        if: ${{ !inputs.dry_run }}
        id: deploy
        run: |
          # --archive=tgz, not a file-by-file upload. Hobby allows 5000 file
          # uploads per day across the whole account (Vercel's "Uploads per day
          # (Free)" rate limit), and one prebuilt deploy of this catalogue runs
          # to thousands of files: ~1200 prerender artifacts, because Cache
          # Components emits segment .rsc payloads alongside each .html, plus
          # the traced dependencies inside every .func. Those artifacts carry
          # scraped prices, so their hashes change every build and Vercel's
          # upload dedup does not cover them. Two or three deploys in a day
          # exhaust the quota, and the next one fails with `api-upload-free` —
          # a 24-hour lockout on deploying anything, since the limit is scoped
          # to the account rather than to this project.
          #
          # The archive collapses that to a few chunk uploads. Vercel documents
          # it as the fix for this case: https://vercel.com/docs/cli/deploy#archive
          # The trade-off is that per-file upload caching between deploys no
          # longer applies, which costs seconds and is worth the lockout it avoids.
          url="$(vercel deploy --prebuilt --prod --archive=tgz)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="v$(date -u +%Y.%m.%d)-${SHORT_SHA}"
          fi

          # Re-tagging the same name would silently point an existing release at
          # different code. Refuse instead.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists. Pass a different one."
            exit 1
          fi

          gh release create "$tag" \
            --target "$SHA" \
            --title "$tag" \
            --notes "Production deploy of \`${SHORT_SHA}\`.

          - Deployment: ${{ steps.deploy.outputs.url }}
          - Prerendered rackets: ${PRERENDERED_RACKETS}
          - Built on GitHub Actions and deployed with \`vercel deploy --prebuilt\`.
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "Released $tag"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${SHA:-unknown}\` |"
            echo "| Prerendered rackets | ${PRERENDERED_RACKETS:-unknown} |"
            echo "| Output files (uploaded as one archive) | ${{ steps.output_size.outputs.files || 'unknown' }} |"
            echo "| Deployment | ${{ steps.deploy.outputs.url || '— (dry run)' }} |"
            echo "| Tag | ${{ inputs.tag || '(auto)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
