name: Shuttlecraft Daily Scraper & Backup Sync

# One shop, one step: nothing in this job may take the rest of it down with it.
#
# The nightly refresh walks four independent storefronts and then runs four
# independent follow-ups (image crawl, ownership audit, backup, upload). Any of
# those can fail on its own for reasons that say nothing about the others — a
# shop behind a new WAF rule, a manufacturer gallery that moved, a Chromium that
# would not start. Every step below therefore reports its own outcome and lets
# the next one run, and a final step reads all of them and decides the verdict
# for the job. A shop that fails is a line in the report; the shops that
# answered are still scraped, synced, audited and backed up.
#
# `continue-on-error` on a step means "your failure is not my successor's
# problem", not "your failure does not matter": `steps.<id>.outcome` keeps the
# real result and the Report Step Outcomes step at the bottom fails the job on
# it. Nothing here is swallowed.

on:
  schedule:
    # Run daily at 01:00 UTC (08:00 AM ICT - Vietnam Time)
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      site:
        description: 'Target site to scrape (vnb, qvbadminton, fbshop, hvshop, shopee, all)'
        required: false
        default: 'all'
      sync_db:
        description: 'Sync scraped data to Supabase database'
        type: boolean
        default: true
      fail_on_site_error:
        description: 'Fail the run when any single shop fails (default: skip that shop and carry on)'
        type: boolean
        default: false

# Two overlapping refreshes would race each other's stale-offer sweep: the
# second run pauses offers the first has not written yet.
concurrency:
  group: daily-scraper
  cancel-in-progress: false

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    # Every step below carries its own cap, and they sum to less than this one
    # on purpose: a job that hits its own timeout is cancelled outright, and
    # cancellation is the one thing that stops Report Step Outcomes from
    # running — the report would be lost exactly when it was most wanted. Keep
    # this above the sum of the step caps when adding a step.
    timeout-minutes: 240

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # @supabase/realtime-js requires Node 22+ for the native WebSocket
          # implementation created by @supabase/supabase-js during sync.
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Playwright's browsers are not part of `npm ci`. Without them the
      # scrape's verification pass could never run — it reported a Chromium
      # that would not start, every night, on every run.
      - name: Install Chromium for Scrape Verification
        id: chromium
        continue-on-error: true
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Test Scraper Failure Isolation
        id: test_scraper
        continue-on-error: true
        timeout-minutes: 5
        run: npm run test:scraper

      - name: Test Manufacturer Image Crawler
        id: test_images
        continue-on-error: true
        timeout-minutes: 5
        run: npm run test:image-scraper

      # A shop that fails is skipped and named in the run summary; the scraper
      # exits non-zero only when *every* shop failed, or when the database
      # write itself did.
      - name: Run Multi-Site Scraper & Sync DB
        id: scrape
        continue-on-error: true
        # 80 minutes for four shops, each capped at 18 (SITE_TIMEOUT below), so
        # even four simultaneously misbehaving shops are each abandoned and
        # reported rather than the last one never being reached. hvshop is the
        # slow one: minutes, where the other three are seconds.
        timeout-minutes: 80
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Without these the scrape writes prices to Postgres and the deployed
          # site keeps serving the old ones until `cacheLife("prices")` expires
          # — up to an hour after the number changed. `scripts/scraper/
          # revalidate.ts` skips silently when they are absent, which is why
          # this went unnoticed: the run still says it succeeded.
          #
          # Both are optional. Add REVALIDATE_URL (https://<site>/api/revalidate)
          # and REVALIDATE_SECRET (the same value the deployment has) as
          # repository secrets to have a scrape publish the moment it finishes.
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          # Read as environment values rather than interpolated into the script,
          # so a dispatch input cannot become shell.
          SITE: ${{ inputs.site }}
          SYNC_DB: ${{ inputs.sync_db }}
          FAIL_ON_SITE_ERROR: ${{ inputs.fail_on_site_error }}
          # Seconds per shop. Sized against this step's own cap above, not
          # against the scraper's 30-minute local default.
          SITE_TIMEOUT: '1080'
        run: |
          FLAGS=(--site="${SITE:-all}" --site-timeout="$SITE_TIMEOUT" --verbose)
          # Empty on a scheduled run, which is the syncing case.
          if [ "$SYNC_DB" != "false" ]; then FLAGS+=(--sync-db); fi
          if [ "$FAIL_ON_SITE_ERROR" = "true" ]; then FLAGS+=(--fail-on-site-error); fi
          # %q, so an input carrying shell metacharacters is shown as the single
          # argument it actually is rather than as something that ran.
          printf 'scraping with:'; printf ' %q' "${FLAGS[@]}"; printf '\n'
          npx tsx scripts/scraper/index.ts "${FLAGS[@]}"

      # venson.vn is the VS brand's own site and the only source for a brand the
      # four storefronts barely stock: it publishes its whole racket line — 42
      # products, in one WooCommerce category with the Store API on — so the
      # import is two JSON requests and needs neither a browser nor the scrape's
      # output. It runs here rather than after the image crawl because a frame
      # this adds should get its photography on the same night, and before the
      # Court Score refresh so the new rows are ranked in this run too.
      #
      # It never touches a racket the catalogue already holds: which of the 42
      # are new is decided by `images/match.ts`, not by the row id. So a night
      # where VS published nothing writes nothing, and the step's whole cost is
      # the two requests.
      - name: Import Venson (VS) Catalogue
        id: venson
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/scraper/venson-catalogue.ts --sync-db --verbose

      # Court Score is computed in TypeScript and stored in `racket_scores`,
      # because src/lib/court-score.ts is the published methodology and must
      # stay the only definition of the formula. The catalogue's default sort
      # reads that table through the `racket_market` view, so a scrape that
      # added rackets leaves them unranked until this runs. Reads the catalogue
      # rather than the scrape's output, so it is worth running even when the
      # walk went badly.
      - name: Refresh Court Scores
        id: market
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run market:refresh -- --verbose

      # `scrape:sync` already called /api/revalidate, so the cached reads are
      # invalidated by the time this runs — which means the next request to
      # each route is the one that refills them. Left alone that is the first
      # visitor of the morning, on the route whose cold fill was measured at
      # 18,57 s. This spends those requests here instead.
      #
      # Runs after Court Scores and `deal_watch` are written, or it would warm
      # the caches with the previous day's ranking and immediately invalidate
      # them again.
      - name: Warm the public routes
        id: warm
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          WARM_BASE_URL: ${{ secrets.WARM_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Optional, like REVALIDATE_URL above: without WARM_BASE_URL there is
          # no site to warm and the script says so rather than failing.
          if [ -z "$WARM_BASE_URL" ]; then
            echo "WARM_BASE_URL is not set — skipping. Add it to warm the cache after a scrape."
            exit 0
          fi
          npm run warm -- --details=20 --markdown | tee -a "$GITHUB_STEP_SUMMARY"

      # The three steps below read the catalogue rather than the scrape's
      # output, so they are worth running even when the walk went badly.
      #
      # Five providers, one step, and the same policy as the shop walk above:
      # `discoverCandidates` returns its failure rather than throwing, so a
      # provider whose catalogue has moved is reported as unreadable and the
      # others still crawl. None needs a browser — ProKennex is a WooCommerce
      # category tree, Felet is three rendered listing pages, fleet.vn is eight,
      # and lining-vn and venson-vn are two API requests each that carry their
      # own galleries — so they share the 45-minute cap rather than each
      # claiming one and pushing the sum of the step caps toward the job's own
      # timeout.
      #
      # fleet-vn, lining-vn and venson-vn are here because neither brand's
      # manufacturer site answers or, for VS, was ever registered: fleet.com.my
      # is dead, li-ning.com publishes no catalogue, and venson.vn went unread
      # until its titles could be reduced to model names. Between them that is
      # 607 rackets with no photography at all until these three were added.
      #
      # Rackets that already have images are skipped unless --refresh is
      # passed, so a nightly run costs the discovery walk and whatever the
      # stores have added since, not the whole gallery again.
      - name: Crawl ProKennex, Felet, Fleet, Li-Ning & Venson Images & Sync DB
        id: images
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 45
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape:images -- --provider=pro-kennex,felet,fleet-vn,lining-vn,venson-vn --verbose

      - name: Audit Racket Image Ownership
        id: audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run images:audit -- --database-only

      - name: Generate Post-Sync Backup
        id: backup
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/backup.ts

      # The read path's costs are invisible from the app: a page renders, and
      # nothing on screen says whether it moved 40 KB or 40 MB. `benchmark.ts`
      # has always measured that and always only printed it; `perf-budget.ts`
      # compares the run to a committed baseline and says whether it got worse.
      #
      # Nightly rather than per-pull-request because it needs the real
      # database, and degraded rather than fatal because a slow night on a
      # shared instance is not the same thing as a slower query.
      - name: Benchmark The Read Path
        id: benchmark
        continue-on-error: true
        timeout-minutes: 20
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          mkdir -p perf
          npm run benchmark -- --json=perf/nightly.json --markdown \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check The Performance Budget
        id: perf_budget
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ ! -f perf/nightly.json ]; then
            echo "::warning title=No benchmark run::The benchmark step produced no JSON, so there is nothing to compare."
            exit 0
          fi
          npx tsx scripts/perf-budget.ts --run=perf/nightly.json --markdown \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Daily Backup Snapshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: daily-db-backup-${{ github.run_number }}
          path: backups/*.json
          # A backup step that failed has already been reported; a missing
          # artifact must not also fail the upload.
          if-no-files-found: warn
          retention-days: 30

      # The verdict. Every step above kept its real result in `outcome`; this is
      # where they are collected, printed together, and turned into one exit
      # code for the job.
      - name: Report Step Outcomes
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          CHROMIUM: ${{ steps.chromium.outcome }}
          TEST_SCRAPER: ${{ steps.test_scraper.outcome }}
          TEST_IMAGES: ${{ steps.test_images.outcome }}
          SCRAPE: ${{ steps.scrape.outcome }}
          VENSON: ${{ steps.venson.outcome }}
          MARKET: ${{ steps.market.outcome }}
          IMAGES: ${{ steps.images.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          BACKUP: ${{ steps.backup.outcome }}
          BENCHMARK: ${{ steps.benchmark.outcome }}
          PERF_BUDGET: ${{ steps.perf_budget.outcome }}
        run: |
          set -uo pipefail

          {
            echo "### Pipeline steps"
            echo
            echo "| Step | Outcome |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          failures=0
          record() {
            local label="$1" outcome="${2:-skipped}" fatal="$3"
            case "$outcome" in
              success) icon="✅" ;;
              failure) icon="❌" ;;
              *)       icon="⏭️" ;;
            esac
            echo "| $label | $icon $outcome |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" = "failure" ]; then
              if [ "$fatal" = "fatal" ]; then
                echo "::error title=Step failed: $label::See this step's log."
                failures=$((failures + 1))
              else
                echo "::warning title=Step degraded: $label::See this step's log; the run continued without it."
              fi
            fi
          }

          # Chromium is the one step whose failure is not the job's: without it
          # the scrape loses its verification pass, which is a second opinion on
          # a scrape that is already written to the database.
          record "Install Chromium"        "$CHROMIUM"     degraded
          record "Scraper tests"           "$TEST_SCRAPER" fatal
          record "Image crawler tests"     "$TEST_IMAGES"  fatal
          record "Multi-site scrape & sync" "$SCRAPE"      fatal
          record "Venson catalogue import"  "$VENSON"     fatal
          record "Court Score refresh"      "$MARKET"     fatal
          # One row, once. This was recorded twice under two labels, which
          # printed a step that does not exist and counted a single failed crawl
          # as two.
          record "Manufacturer image crawl" "$IMAGES"      fatal
          record "Image ownership audit"   "$AUDIT"        fatal
          record "Post-sync backup"        "$BACKUP"       fatal
          # Measurement, not the product. A slow night on a shared instance is
          # not the same thing as a slower query, so neither of these takes the
          # nightly refresh down — they report, and the summary carries the
          # number and the comparison against perf/benchmark-baseline.json.
          record "Read-path benchmark"     "$BENCHMARK"    degraded
          record "Performance budget"      "$PERF_BUDGET"  degraded

          if [ "$failures" -gt 0 ]; then
            {
              echo
              echo "**$failures step(s) failed.** Every other step ran; see the table above."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "❌ $failures step(s) failed — failing the job after running everything else."
            exit 1
          fi

          echo "✅ Every step completed."
