name: Deploy admin production

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
  workflow_dispatch:

concurrency:
  group: admin-production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ vars.ADMIN_VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.ADMIN_VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_CLI_VERSION: "59.11.2"

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check isolated Vercel configuration
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            value="${!name}"
            if [ -z "$value" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        run: npm ci

      - name: Typecheck admin
        run: npm run typecheck

      - name: Lint admin
        run: npm run lint

      - name: Install pinned Vercel CLI
        run: npm install -g --allow-scripts=esbuild "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull admin production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build admin production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt admin artifact
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed Shuttlecraft Admin: $url"

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Shuttlecraft Admin deployment"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA:0:8}\` |"
            echo "| Vercel project | \`${VERCEL_PROJECT_ID:-not configured}\` |"
            echo "| Deployment | ${{ steps.deploy.outputs.url || 'Failed before deployment' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
